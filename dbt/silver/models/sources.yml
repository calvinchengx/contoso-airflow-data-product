version: 2

# Bronze, as this product names it. The sibling calls POS's tables
# `bronze_customers` / `bronze_orders` because POS is "the" source system there;
# this product prefixes every vendor, so the mapping lives here rather than in
# each model. Renaming bronze to match would have invalidated a verification
# already done against these names.
sources:
  - name: bronze
    # THE LAKEHOUSE'S OWN SCHEMA, which is where a Lakehouse's tables are.
    #
    # This said `default` and was propped up by the product registering every
    # bronze table into the engine's session catalog on each run. Measured
    # against a COLD engine, with no registration at all:
    #
    #     lake.bronze_pos_customers      -> 102,000
    #     default.bronze_pos_customers   -> TABLE_OR_VIEW_NOT_FOUND
    #
    # A Lakehouse's Tables/ are discovered into a schema named after the
    # lakehouse -- on real Fabric and here -- and it is the same name this
    # project's own profile already writes silver into. `default` was a name
    # only the product's own registration created, so depending on it meant
    # carrying that step forever. `dbo` is the Warehouse's convention and
    # resolves to nothing on this side.
    schema: "{{ env_var('DBT_LAKEHOUSE_NAME', 'lake') }}"
    tables:
      - name: bronze_pos_customers
      - name: bronze_pos_orders
      - name: bronze_web_customers
      - name: bronze_web_orders
      - name: bronze_web_products
      - name: bronze_ref_product_hierarchy
      - name: bronze_ref_fx_rates
      - name: bronze_erp_customer_changes
