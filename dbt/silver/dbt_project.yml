# Silver: conform, resolve identity, quarantine. Gold reads only silver.
#
# MATERIALISED INTO THE LAKEHOUSE by dbt-fabricspark over Livy -- the emulator
# terminates Livy, the statement agent executes, and Sail does the compute. The
# Airflow worker holds no Spark session at any point; it submits.
#
# This replaces contoso-fabric-platform's Spark notebook with the same transform
# expressed declaratively. The notebook could not run on this platform at all --
# it needs a Fabric notebook item and an engine to publish it to -- but the
# LOGIC is the sibling's, so the two silvers must agree row for row.
name: contoso_silver
version: "1.0.0"
config-version: 2
profile: contoso_silver
model-paths: ["models"]
macro-paths: ["macros"]
models:
  contoso_silver:
    +materialized: table
    +file_format: delta
    # WHERE THE TABLE LIVES, and it is not a detail. Without `location_root`
    # the adapter emits `create or replace table x as select ...` with no
    # LOCATION, the engine writes into its own warehouse directory, and the
    # result is a table that is real, queryable from Spark, and invisible to
    # the Lakehouse -- so its SQL analytics endpoint never reflects it and
    # every one of gold's `source('silver', ...)` fails to resolve. Measured
    # before this line existed: the endpoint listed the 8 bronze tables (which
    # bronze registers with an explicit LOCATION) and none of silver's 7.
    #
    # Under `Tables/` because that is the directory a Lakehouse discovers.
    # The value is supplied per run by the DAG's `fabric_env` from
    # `catalog.tables_root()`, so there is ONE spelling of the OneLake URI.
    # The default is only for cosmos's parse-time `dbt ls`, which does not
    # connect.
    +location_root: "{{ env_var('DBT_SILVER_LOCATION_ROOT', 'abfss://render-time-placeholder@onelake.dfs.fabric.microsoft.com/lake.Lakehouse/Tables') }}"

vars:
  # The vendors disagree about country spelling ON PURPOSE -- POS ships "USA",
  # "U.S." and "UNITED STATES" for the same place, and gold reports everything
  # against the reference hierarchy. This is `contoso_product.COUNTRY` verbatim:
  # the sibling conforms with exactly this map, and a variant present in one
  # platform and missing in the other would make the two silvers disagree on
  # country while every count still matched.
  country_variants:
    US: US
    USA: US
    "U.S.": US
    UNITED STATES: US
    GB: GB
    GBR: GB
    UK: GB
    "U.K.": GB
    UNITED KINGDOM: GB
    SG: SG
    SGP: SG
    SINGAPORE: SG
