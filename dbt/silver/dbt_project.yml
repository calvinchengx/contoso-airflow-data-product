# Silver: conform, resolve identity, quarantine. Gold reads only silver.
#
# MATERIALISED INTO THE LAKEHOUSE by dbt-fabricspark over Livy -- the emulator
# terminates Livy, the statement agent executes, and Sail does the compute. The
# Airflow worker holds no Spark session at any point; it submits.
#
# This replaces contoso-fabric-platform's Spark notebook with the same transform
# expressed declaratively. The notebook could not run on this platform at all --
# it needs a Fabric notebook item and an engine to publish it to -- but the
# LOGIC is the sibling's, so the two silvers must agree row for row.
name: contoso_silver
version: "1.0.0"
config-version: 2
profile: contoso_silver
model-paths: ["models"]
macro-paths: ["macros"]
models:
  contoso_silver:
    +materialized: table
    +file_format: delta

vars:
  # The vendors disagree about country spelling ON PURPOSE -- POS ships "USA",
  # "U.S." and "UNITED STATES" for the same place, and gold reports everything
  # against the reference hierarchy. This is `contoso_product.COUNTRY` verbatim:
  # the sibling conforms with exactly this map, and a variant present in one
  # platform and missing in the other would make the two silvers disagree on
  # country while every count still matched.
  country_variants:
    US: US
    USA: US
    "U.S.": US
    UNITED STATES: US
    GB: GB
    GBR: GB
    UK: GB
    "U.K.": GB
    UNITED KINGDOM: GB
    SG: SG
    SGP: SG
    SINGAPORE: SG
