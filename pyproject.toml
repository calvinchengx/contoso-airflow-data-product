[project]
name = "contoso-data-product-fabric-airflow3"
version = "0.1.0"
description = "The Contoso data product for Apache Airflow 3: dlt sources, dbt models, ODCS contracts."
requires-python = ">=3.12"
authors = [{name = "Calvin Cheng", email = "calvin@calvinx.com"}]

# WHAT THE WORKER MUST IMPORT. The platform installs exactly this with
# `uv pip install -r pyproject.toml`; there is no requirements.txt anywhere.
#
# Deliberately NOT here: dlt's Azure extras (dlt[filesystem], dlt[deltalake],
# dlt[fabric]). Phase 0 measured all three against the emulator and all three
# failed the same way -- dlt's credential model carries account-key, SAS and
# service-principal shapes and has NO bearer field, so a raw storage_options
# dict is unrecognised and dlt falls through to DefaultAzureCredential. Left
# unisolated it reached real Microsoft endpoints. dlt extracts; delta-rs and
# stdlib HTTP write. Neither needs an Azure SDK.
dependencies = [
    "dlt==1.30.0",
    "deltalake>=0.23,<2",
    "pyarrow>=18,<24",
    # The ERP vendor's stream. A Kafka client is the only way to consume what
    # Debezium produced -- the alternative, reading the ERP table directly,
    # would be a snapshot and not a change stream at all.
    "kafka-python>=2.0.2,<3",
    # SILVER lands in the Lakehouse over Livy; GOLD lands in the Warehouse over
    # TDS. Two adapters because they are two surfaces, and both are already
    # witnessed against this emulator by its own e2e suites.
    "dbt-core>=1.9,<2",
    "dbt-fabricspark>=1.9,<2",
    "dbt-fabric>=1.9,<2",
    # Declared because THIS code calls it, not only dbt-fabric: the reflection
    # gate connects over TDS itself to prove silver is visible before gold
    # builds. Leaving it implicit would mean a transitive dependency of an
    # adapter deciding whether our own witness runs.
    "mssql-python>=1.0,<2",
    # Renders a dbt project as one Airflow task per model, with dbt's own graph
    # as the dependencies -- which is what puts bronze -> silver -> gold in the
    # UI as real edges and lets one model retry alone.
    "astronomer-cosmos>=1.15,<2",
    # GOLD'S MODELS COME FROM HERE, not from this repo. That package exists so
    # the gold project is not copied per platform; depending on it is the whole
    # point of it being a package.
    "contoso-data-product",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.14,<0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contoso_airflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv]
# FORCE THE PATCHED sqlparse PAST dbt-core's PIN.
#
# Four advisories (three high) land on sqlparse <= 0.5.5 and are fixed only in
# 0.6.0, which dbt-core 1.12.2 forbids (`sqlparse<0.6.0,>=0.5.5`). uv proves the
# requirements unsatisfiable without this: every non-yanked dbt-core in
# >=1.9,<2 carries that bound, so there is no version pair that resolves.
#
# An override is not a claim that dbt is fine with 0.6.0 -- it is a claim that
# has to be TESTED, which is why this landed with a full pipeline run behind it
# rather than a green lockfile. Remove it the moment dbt-core allows 0.6.0
# itself; an override that outlives its reason silently pins a dependency
# nobody is watching.
override-dependencies = ["sqlparse>=0.6.0"]

[tool.uv.sources]
# BY GIT TAG, not by sibling path. A path dependency resolves only from a
# checkout that happens to have both repos side by side -- the worker image
# receives this product's directory and nothing else, so `../contoso-data-product`
# is `Distribution not found` at build time. It would also make the platform
# product-specific: to support it, the platform's Dockerfile would have to know
# which siblings to copy.
#
# A tag is what production would pin regardless, so this is the honest form
# rather than a workaround for the container.
contoso-data-product = { git = "https://github.com/calvinchengx/contoso-data-product.git", tag = "v0.6.0" }
